# 프로젝트 단일 설정 소스.
# 기간 / 종목 / 하이퍼파라미터 / 매매 임계값을 여기서만 바꾼다.
# 코드 안에 숫자를 하드코딩하지 말 것.

project:
  name: capstone_stock_prediction
  seed: 42

# ---------------------------------------------------------------- 데이터
data:
  # 유니버스: 섹터 고정 아님. 데이터 수급 되는 종목 위주로 조정.
  # sector 는 TFT 변수선택망(VSN)의 static covariate 로 쓴다.
  #   ⚠️ 키움 ka10001 에 업종 필드가 없어서(2026-08-24 확인) 여기에 직접 적는다.
  #      종목이 늘어나면 이 표도 같이 채울 것.
  universe:
    - { code: "005930", name: "삼성전자",         sector: "반도체" }
    - { code: "000660", name: "SK하이닉스",       sector: "반도체" }
    - { code: "042700", name: "한미반도체",       sector: "반도체장비" }
    - { code: "005380", name: "현대차",           sector: "자동차" }
    - { code: "035420", name: "NAVER",           sector: "인터넷" }
    - { code: "051910", name: "LG화학",           sector: "화학" }
    - { code: "207940", name: "삼성바이오로직스", sector: "바이오" }
    - { code: "105560", name: "KB금융",           sector: "금융" }

  # 매크로 시퀀스 (크로스어텐션의 Key/Value 쪽)
  macro:
    indices:
      - { code: "001", name: "KOSPI" }
      - { code: "101", name: "KOSDAQ" }
    # 해외지수 TR 이 계좌 권한 문제로 막히면 국내상장 ETF 로 대체 수집한다.
    overseas_etf_fallback:
      - { code: "390390", name: "KODEX 미국반도체MV" }

  start_date: "2015-01-01"
  end_date: null          # null = 오늘까지
  storage_format: parquet # data/raw/{kind}/{code}.parquet

# ------------------------------------------------------- 학습/검증 분할
# 날짜 기준 global split. 정규화 통계는 train 구간에서만 계산한다.
split:
  train_end: "2022-12-31"
  val_end: "2023-12-31"
  # val_end 이후 ~ end_date = test
  embargo_days: 5   # 구간 경계에서 라벨 누수 방지용 공백

# ------------------------------------------------------------ 피처
features:
  return_horizon: 5        # 예측 대상: t+1 ~ t+5 누적 로그수익률
  # raw | market_relative — 시장 공통성분을 뺄지. 근거는 build.py:_apply_target_mode
  target_mode: raw
  # 같은 날 전 종목 대비 백분위 순위를 피처로 추가할 목록. 빈 값이면 끈다.
  # 이름은 xs_<원본> 이 되고, 모델은 이 채널만 RevIN 을 건너뛴다 —
  # RevIN 이 종목별 창 안에서 표준화하면 "오늘 몇 등인가"가 지워지기 때문이다.
  cross_sectional: []
  lookback: 120            # 입력 시퀀스 길이(영업일)
  technical:
    ma_windows: [5, 20, 60]
    rsi_period: 14
    macd: { fast: 12, slow: 26, signal: 9 }
    bollinger: { window: 20, num_std: 2.0 }
    atr_period: 14
    cci_period: 20

# ------------------------------------------------------------ 모델
model:
  phase: 1                 # 1 = Transformer, 2 = Mamba 하이브리드(스트레치)
  revin:
    affine: true
    eps: 1.0e-5
    scale_target: true     # 윈도우 변동성으로 타깃 스케일링 → 출력에서 역변환
  patch:
    patch_len: 5           # 5영업일 = 1주 단위 토큰
    stride: 5              # 겹치지 않게. 겹치려면 stride < patch_len
  # 스윕(2026-08-25) 결과 확정값. 작을수록 좋았다 — 실질 독립 정보가
  # 거래일 수(~1,900) 수준이라 큰 모델은 바로 과적합한다.
  #   current 1.88M → +0.51% (epoch 1)   ← 과적합
  #   tiny    0.49M → +3.16% (epoch 1)
  #   small   0.67M → +3.28% (epoch 1)
  #   minimal 0.33M → +3.35% (epoch 3)   ← 유일하게 과적합 없음
  encoder:
    d_model: 32
    n_heads: 2
    n_layers: 1
    d_ff: 64
    dropout: 0.5
  cross_attention:
    n_heads: 2
    dropout: 0.5
  vsn:
    hidden_size: 64
    dropout: 0.5
  head:
    quantiles: [0.1, 0.5, 0.9]

# ------------------------------------------------------------ 학습
training:
  # 35만 샘플 기준. batch 64 로는 epoch당 4,068 step 이라 MPS에서 19분/epoch.
  # GPU(T4 등)에서는 512까지 올려도 된다 — scripts/train.py --batch-size 로 덮어쓴다.
  batch_size: 256
  epochs: 50               # early stopping 이 먼저 걸린다. 상한만 둔다
  lr: 2.0e-4
  weight_decay: 1.0e-2     # 스윕에서 강한 정규화가 이겼다
  grad_clip: 1.0
  early_stopping:
    patience: 5            # 과적합이 2~3 epoch 에 오므로 오래 기다릴 이유가 없다
    min_delta: 1.0e-5
    monitor: val_pinball
  scheduler: cosine
  warmup_epochs: 2
  num_workers: 0           # macOS + MPS 에서는 0. CUDA 면 train.py 가 자동으로 4로 올린다

# --------------------------------------------------- 매매 신호 (백테스트/모의투자 공용)
# 아래 수치는 전부 백테스트로 튜닝할 대상 — 확정값 아님.
trading:
  abstain:
    # (q90-q10)이 임계값보다 넓으면 기권(관망).
    # ⚠️ 절대값을 추측하면 거의 항상 틀린다 — 초기 추측 0.05 로는 기권률 95.8%,
    #    거래 0건이 나왔다(5일 수익률의 자연 폭은 0.124).
    # percentile: 50 = 예측 폭이 가장 좁은(=가장 확신하는) 50%만 거래한다.
    # ⚠️ 30 → 50 (2026-08-27). 30 은 Sharpe 최적이지만 후보를 깎아 노출을 눌렀다.
    #    목표가 '코스피200 대비 수익률'로 바뀌어 수익 쪽으로 튼 값이다.
    #    실측(구간정렬): CAGR val +24.9→26.7% / test +24.0→31.7%.
    #    대가는 Sharpe 1.84→1.64, MDD -7.3→-10.8%. 아래 두 값과 한 묶음이다.
    percentile: 50
    max_interval_width: 0.05   # percentile 이 없을 때만 쓰이는 절대값
  direction:
    # ⚠️ absolute 는 예측 수준(level)이 국면과 어긋나면 그대로 무너진다.
    #    실측(2026-08-25 test): 모델 5일 중앙값 -0.15% vs 실제 평균 +0.80%,
    #    매수 임계값 0.40% 가 예측 90분위(0.27%)보다 높아 2.1년간 체결 64건.
    #    순위 방식은 모든 종목에 공통으로 낀 편차가 상쇄되어 이 문제를 안 받는다.
    mode: cross_sectional      # absolute | cross_sectional
    # 살 때: 기권 통과분 중 q50 상위 N개.
    # ⚠️ 10 → 20 (2026-08-27). Grinold 의 능동운용 기본법칙 IR = IC x sqrt(breadth) —
    #    우리 IC 는 0.024 로 매우 낮다. 낮은 IC 를 만회하는 유일한 축이 breadth 다.
    #    10종목은 IC 대비 과집중이라 종목 노이즈가 알파를 덮는다.
    #    실측(144격자 x val/test x 비용2벌): top_n 10/20/30/40 의 평균 Sharpe 가
    #    val -0.19/0.62/0.81/0.66, test 0.63/0.93/1.00/1.09 — 두 구간 모두 단조 개선.
    #    20 과 30 이 사실상 동률이라 변경폭이 작은 20 을 택했다.
    top_n: 20
    # 팔 때: 이 순위 밖으로 나갈 때만. top_n 과 같게 두면 버퍼 없음.
    # 11등이 된 종목을 파는 건 정보가 아니라 노이즈에 반응하는 것이다 —
    # 그 노이즈에 연 7%(회전율 46.9 x 편도 15.5bp)를 냈다.
    # 합성 검증: 신규 편입이 리밸런싱당 5.69 → 2.51개 (-56%).
    # NBIM no-trade band 관행대로 top_n 의 2배를 유지한다 (10→20 이므로 20→40).
    exit_rank: 40
    min_candidates: 20         # 후보가 이보다 적으면 순위가 무의미 → 전원 관망
    long_threshold: 0.004      # mode=absolute 에서만 쓰인다
    short_threshold: -0.004    # mode=absolute 에서만 쓰인다
  sizing:
    # inverse_width 는 conf x max_pos 라 기권 통과 종목들의 conf 가 0 근처에 몰려
    # 총 노출이 20%를 못 넘었다. rank_normalized 는 선택된 종목들 사이에서
    # 비중을 정규화해 목표 노출을 채운다 (상대적 확신도 순서는 그대로 보존).
    method: rank_normalized    # rank_normalized | inverse_width | kelly
    # ⚠️ true → false (2026-08-27). 켜져 있으면 생존 후보 수에 비례해 현금을 늘린다.
    #    그 자체는 기권 로직의 확장이지만, **시장 타이밍 능력이 검증된 적이 없다** —
    #    우리가 측정한 건 횡단면 IC(종목 간 순위)뿐이고 '언제 쉬어야 하는가'는 아니다.
    #    Clarke·de Silva·Thorley(2002): 현금 보유 제약이 transfer coefficient 를 깎는다.
    #    실측: 평균 노출 61% → 81%. 이게 수익률 차이의 대부분이다.
    #    ⚠️ 끄면 "기권이 얼마나 쉬는가에도 영향을 준다"는 서술은 더 이상 성립하지 않는다.
    #       기권은 여전히 **무엇을 사는가**를 결정한다(percentile 로 후보를 자른다).
    exposure_scaling: false
    kelly_fraction: 0.25       # method=kelly 일 때 사용하는 축소계수
    max_position_pct: 0.10     # 개별 종목 자산 대비 상한
    # 비중 변화가 이보다 작으면 거래하지 않는다. 버퍼로 종목을 유지해도
    # 매 회차 재정규화 때문에 잔챙이 거래가 남는데, 그걸 막는다.
    # ⚠️ 전량 청산(w=0)은 이 밴드와 무관하게 항상 실행된다 — 안 그러면 손절이 막힌다.
    min_trade_weight: 0.01
  risk:
    stop_loss_pct: -0.05
    take_profit_pct: 0.10
    # 리밸런싱 주기마다 도는 값이라 실질적으로 '리밸런싱당 한도'다.
    # 5 였을 때 10종목 포트폴리오가 절반에서 잘렸다(실측: 리스크 차단 57회).
    # top_n 의 2배를 유지한다 — 한도가 포트폴리오를 자르면 안 된다.
    max_trades_per_day: 40
    # ⚠️ 0.90 → 1.00 (2026-08-27). 10% 를 상시 현금으로 두던 상한.
    #    셋 중 이것만 따로 풀면 Sharpe·Calmar 까지 같이 올랐다(1.84→1.86, 3.27→3.35).
    max_gross_exposure: 1.00
  costs:
    commission_bps: 1.5        # 편도 수수료 (모의투자 기준)
    tax_bps: 18.0              # 매도 시 거래세
    slippage_bps: 5.0

# ------------------------------------------------------------ 백테스트
backtest:
  initial_capital: 100000000   # 1억
  execution_lag_days: 1        # t 예측 → t+1 종가 체결. 0 이면 방금 본 가격에 거래하는 셈
  # ⚠️ 5 → 10 (2026-08-27). "지평과 맞춘다"는 비용이 0 일 때만 옳다.
  # Garleanu-Pedersen(2013): 최적 거래속도는 지평이 아니라 **알파 감쇠 속도 대비 비용**이
  # 정한다 — 목표를 향해 부분적으로만 이동하는 것이 최적이다.
  # 실측 평균 Sharpe (모의계좌 비용): 5일 val 0.30/test 0.72, 10일 0.51/0.94, 20일 0.62/1.07.
  # 연회전율은 30.8 → 17.7 로 절반. 20일은 표본이 얇아져 10일을 택했다.
  rebalance_days: 10
  walk_forward:
    train_months: 36
    val_months: 6
    test_months: 6
    step_months: 6
  metrics: [sharpe, sortino, calmar, max_drawdown, hit_rate, turnover]

# ------------------------------------------------- 프로파일 (base 와의 차이만)
# `load_config(profile="intraday")` 가 이 블록을 위에 덮어쓴다.
# 설정 파일을 갈라놓지 않는 이유: 값이 두 곳에 흩어지면 어느 쪽이 진짜인지 모르게 된다.
profiles:

  # 횡단면 피처 트랙. 진단 결과 모델이 **언더피팅**이었다 —
  # in-sample 랭크 IC 조차 0.0406(test 0.0241), 십분위 스프레드 t=1.10.
  # 원인은 입력에 '오늘 시장 대비 상대 위치'가 아예 없었다는 것. 근거는
  # build.py:_add_cross_sectional 과 phase1.py:n_passthrough.
  xs:
    data:
      processed_suffix: "_xs"
    features:
      cross_sectional:
        - ret_5d          # 단기
        - ret_20d
        - mom_12_1        # 12-1 모멘텀 (Jegadeesh & Titman 1993)
        - rev_1m          # 단기 반전
        - rsi
        - rvol_20         # 변동성 — 저변동 이상현상
        - vol_ratio
        - turnover_z      # 유동성

  # 횡단면 피처 + 시장 대비 초과수익 타깃 (둘 다).
  xs_mr:
    data:
      processed_suffix: "_xsmr"
    features:
      target_mode: market_relative
      cross_sectional:
        - ret_5d
        - ret_20d
        - mom_12_1
        - rev_1m
        - rsi
        - rvol_20
        - vol_ratio
        - turnover_z

  # 시장 대비 초과수익 타깃 트랙. 일봉과 모든 게 같고 **타깃 정의만** 다르다 —
  # 대조군이 되려면 다른 건 전부 고정해야 한다.
  mktrel:
    data:
      processed_suffix: "_mr"      # panel_mr.parquet / 체크포인트 phase1_xxxx_mr.pt
    features:
      target_mode: market_relative

  # 60분봉 타점 탐지 트랙. 일봉 트랙은 이 블록을 읽지 않는다.
  # 목표가 다르다 — 주기적 리밸런싱이 아니라 **조건이 맞는 타점에서만 진입**한다.
  intraday:
    data:
      chart_kind: minute60             # data/raw/minute60/
      macro_index_kind: index_minute60
      macro_etf_kind: minute60         # ETF 도 일반 종목이라 같은 디렉터리에 쌓인다
      processed_suffix: "_60m"         # data/processed/panel_60m.parquet
    features:
      return_horizon: 7                # 7봉 = 1거래일. 지평을 줄이면 비용이 알파를 삼킨다
      lookback: 120                    # 120봉 ≈ 17거래일
    split:
      # ⚠️ 분봉 이력이 13개월(2025-08-01~)뿐이라 구간이 좁다.
      #    train 8개월 / val 2개월 / test 3개월.
      train_end: "2026-03-31"
      val_end: "2026-05-31"
      embargo_days: 1                  # 라벨이 7봉(1일)만 앞을 보므로 하루면 충분하다
    trading:
      # 순위(cross_sectional)가 아니라 **조건**이다. 못 닿으면 대기가 정답이다.
      # 일봉에서 absolute 가 실패한 건 "포트폴리오를 늘 채워야 한다"는 전제 때문이었다.
      direction:
        mode: absolute
        # 진입 임계값. generate_signal 이 왕복비용(0.0031)을 하한으로 강제하므로
        # 이 값은 그 위에서만 의미가 있다. 4단계에서 q50 분포를 보고 조정한다.
        long_threshold: 0.004
      sizing:
        # 노출은 목표치를 채우는 게 아니라 **조건 충족 종목 수**가 정한다.
        exposure_scaling: false
        # 보유분을 재조정하지 않으므로(hold_until_exit) 잔챙이 거래가 애초에 없다.
        min_trade_weight: 0.0
      risk:
        # ⚠️ 아래 세 값이 "정확한 타점에 익절"의 조작적 정의다. 추측이 아니라
        #    지평의 자연 폭에서 잡았다 — 60분봉 1거래일 변동성이 약 2% 다.
        #    4단계에서 청산 사유 분포(익절/손절/만료)를 보고 조정한다.
        take_profit_pct: 0.03
        stop_loss_pct: -0.02
        max_holding_bars: 7        # 예측 지평(7봉)이 지나면 그 예측은 만료다
        max_trades_per_day: 5      # 여기서는 '한 봉당' 이다 — 한 번에 몰아 넣지 않는다
    backtest:
      rebalance_days: 1            # 매 봉 탐지. 진입은 조건이 맞을 때만 일어난다
      execution_lag_days: 1        # t 봉 예측 → t+1 봉 종가 체결
      bars_per_year: 1764          # 252 x 7봉. 연율화 계수를 틀리면 Sharpe 가 sqrt(7) 어긋난다
      hold_until_exit: true        # 신호가 없다고 팔지 않는다 — 익절/손절/만료로만 청산
